# yonderbot.net 主站。内容、接口与 WebSocket 路由与旧域名一致；旧域名
# yonder.zethai.cn 只保留一个 301 跳转（见本文件末尾）。
server {
    listen 80;
    server_name yonderbot.net www.yonderbot.net;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name yonderbot.net www.yonderbot.net;
    ssl_certificate /etc/nginx/ssl/yonderbot.net/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/yonderbot.net/yonderbot.net.key;
    root /opt/yonder-card/web/current;
    index index.html;
    client_max_body_size 2m;
    gzip on;
    gzip_types application/javascript text/javascript text/css application/json;
    location = /yonder-sw.js { alias /opt/yonder-card/web/current/yonder-sw.js; add_header Cache-Control "no-cache" always; }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18051;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }
    location ^~ /api/device {
        access_log off;
        proxy_pass http://127.0.0.1:18051;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }
    location = /ws/work {
        proxy_pass http://127.0.0.1:18051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location ~ ^/ws(/device|/execution)?$ {
        proxy_pass http://127.0.0.1:18051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    # yonder-console begin
    location = /console { return 308 /console/; }
    location /console/ {
        proxy_pass http://127.0.0.1:7690/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    # yonder-console end
}
