schema: 1
locale: zh-CN
timezone: Asia/Shanghai
plugins:
  - use: "@yonder/plugin-channel-cli"
  - use: "@yonder/plugin-context-files"
  - use: "@yonder/plugin-agent-presets"
  - use: "@yonder/plugin-web-tools"
channels:
  cli:
    type: cli
envs:
  local:
    type: local
agents:
  - id: main
    workspace: ./agents/main
identity:
  persons:
    - id: owner
      name: owner
      accounts:
        - acct:cli:local
models:
  # M2 (owner 10-28 23:40): WorkBuddy free pool first, rightapi-glm/glm-5.3-flash as the fallback.
  # SiliconFlow DeepSeek is not in this chain at all (cost too high). A pay-as-you-go model is only
  # acceptable when both its input and output price stay at or below 0.6 yuan per million tokens.
  chain:
    - workbuddy
    - rightapi-glm/glm-5.3-flash
  priceCapPerMTokenYuan: 0.6
  providers:
    rightapi-glm:
      baseUrl: https://www.rightapi.ai/v1
      api: openai-completions
      authHeader: true
      # rightapi 网关删掉开头的 system 消息；系统提示词改放第一条 user（spec/08 §2）。
      compat:
        systemAsUser: true
      models:
        - id: glm-5.3-flash
          name: GLM-5.3-Flash
          reasoning: true
          input: [text, image]
          contextWindow: 1000000
          maxTokens: 16384
          compat:
            supportsStore: false
            supportsDeveloperRole: false
    # WorkBuddy free pool (no SiliconFlow DeepSeek anywhere in this chain). The cloud has no
    # local workbuddy hub, so this provider is only reachable through the INF01 reverse tunnel
    # (127.0.0.1:13001 -> local hub 127.0.0.1:8788, see yonder-lead/lanes/evidence/gw-tunnel.md).
    # It is the primary (M2): rightapi-glm/glm-5.3-flash is the fallback when the tunnel is down.
    workbuddy:
      baseUrl: http://127.0.0.1:13001/v1
      api: openai-completions
      authHeader: true
      models:
        - id: deepseek-v4.1-flash
          name: DeepSeek V4.1 Flash (WorkBuddy free)
          contextWindow: 1000000
          maxTokens: 65536
          input: [text, image]
# Cloud node: reachable only through the TLS reverse proxy (`deploy-node.sh nginx`).
# `remoteOwner` lets the access-token login (cookie session) talk to the resident Bot;
# the gateway itself listens on loopback only. The publicOrigins line is filled in by
# `deploy-node.sh push` from YONDER_PUBLIC_ORIGIN (and removed when it is unset).
gateway:
  enabled: true
  port: 7690
  basePath: /console/
  trustProxy: true
  remoteOwner: true
  publicOrigins: ["__YONDER_PUBLIC_ORIGIN__"]
compaction:
  enabled: true
  backgroundAtTokens: 272000
