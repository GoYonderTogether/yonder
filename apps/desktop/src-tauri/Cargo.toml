[package]
name = "yonder-desktop"
version = "0.3.0"
edition = "2021"

# 移动端（Android/iOS）只构建 lib；桌面仍由 src/main.rs 生成可执行文件。
[lib]
name = "yonder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
