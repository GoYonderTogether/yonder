name: Feature request · 功能建议
description: Propose a capability · 提出新能力
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem · 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal · 方案
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where should it live? · 应当放在哪里？
      description: The kernel stays small; most capabilities belong in plugins. · 内核保持精简，多数能力应是插件。
      options:
        - Plugin · 插件
        - Skill · skill
        - Kernel · 内核
        - Not sure · 不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered · 考虑过的其他方案
