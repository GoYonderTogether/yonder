# 发版走 CI：由这里统一包版本、写 CHANGELOG、打 tag、推 main 并建 Release。
# 顺序固定：发版提交直接接在 main tip 上 → 构建打包 → 原子推送 tag 与 main → 最后建 Release。
# 任何一步失败都不会留下一个 main 里不存在的正式 Release（2026-10-31 之前从分叉分支发版、
# rebase 失败留下过 v0.3.26103014/.19 这样的孤儿）。
# 云端部署不在这里：CI 拿不到服务器凭据，仍用 scripts/deploy-node.sh 走 SSH。
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 执行发版的起点；必须是 main 的历史（作业随后 fast-forward 到 main 当前 tip）
        required: false
        default: main
        type: string
      version:
        description: 显式版本号 0.<minor>.<YYMMDDNN>，留空按当天序号递增
        required: false
        default: ""
        type: string
      require_ci:
        description: 发版前等待该 commit 的 CI 全部成功（自动发版始终检查）
        required: false
        default: true
        type: boolean
      expected_sha:
        description: 自动发版锁定的已验证提交；main 已变化则拒绝发版
        required: false
        default: ""
        type: string

permissions:
  contents: write
  checks: read
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, CHANGELOG and GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ripgrep zsh
      # 发版点只能是 main 上的提交。从分叉分支发版会让发版提交带着整条分支历史 rebase 进 main，
      # 冲突后留下的就是「Release 已建、main 没有」的孤儿版本；这里提前拒绝，不给任何副作用。
      # 比较的是提交对象：ref=main 时 HEAD 是分支名，--is-ancestor 拿它当提交查会失败。
      - name: ref 必须是 main 的历史
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "::error::$INPUT_REF 不在 origin/main 的历史里；先把它合进 main 再发版"
            exit 1
          fi
        env:
          INPUT_REF: ${{ inputs.ref || 'main' }}
      # 发版提交直接落在 origin/main 当前 tip 上，之后到 main 的推送必然是快进，不会冲突。
      # 发出去的内容就是 main 的 tip，所以下面两道检查（CI 门禁与重复发版）都针对这个 tip。
      - name: 对齐到最新 main
        run: |
          if [ -n "$EXPECTED_SHA" ]; then
            node scripts/release/auto-release.mjs --assert-target "$EXPECTED_SHA" "$(git rev-parse origin/main)"
          fi
          git merge --ff-only origin/main
          if [ -n "$EXPECTED_SHA" ]; then
            node scripts/release/auto-release.mjs --assert-target "$EXPECTED_SHA" "$(git rev-parse HEAD)"
          fi
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
      - name: 该 commit 的 CI 必须全部成功
        if: ${{ inputs.require_ci || inputs.expected_sha != '' }}
        run: >-
          node scripts/release/ci-status.mjs
          --sha "$(git rev-parse HEAD)" --wait 900
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 同一 commit 不重复发版
        run: node scripts/release/version.mjs --assert-unreleased
      - name: 计算版本
        id: version
        run: |
          set -- --next
          [ -n "$INPUT_VERSION" ] && set -- "$@" --version "$INPUT_VERSION"
          next="$(node scripts/release/version.mjs "$@")"
          echo "version=$next" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - run: npm ci
      - name: 统一所有 workspace 包版本
        run: node scripts/release/bump-versions.mjs --version "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: 写 CHANGELOG 小节
        run: node scripts/release/changelog.mjs --build --version "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: 提交并发版 tag
        run: |
          git config user.name "yonder-release"
          git config user.email "release@yonder.local"
          git add -A
          git commit -m "chore(release): $VERSION"
          git tag "v$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: 版本一致性
        run: node scripts/version-check.mjs --tag "v$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - run: npm run build
      - name: 打安装附件与 SHA256SUMS
        run: node scripts/release/pack-runtime.mjs --out dist-release
      # 一键安装脚本随 Release 发布，网页用 releases/latest/download/install.sh 取，永远指向最新正式版。
      - name: 收入一键安装脚本
        run: |
          cp scripts/install.sh scripts/install.ps1 dist-release/
          (cd dist-release && sh -n install.sh)
      # main 与 tag 一次原子推送：要么都成功，要么都没落地。重试只处理瞬时失败；若 main 在发版期间
      # 被别人推送，推送会一直非快进而失败，此时什么都没有落地（没有 tag、没有 Release），重跑发版即可。
      - name: 推送 tag 与 main
        run: |
          for attempt in 1 2 3; do
            git push --atomic origin "HEAD:main" "refs/tags/v$VERSION" && exit 0
            sleep 10
          done
          echo "::error::推送失败。tag 与 main 都没有更新、也没有 Release；确认 main 后重新触发发版"
          exit 1
        env:
          VERSION: ${{ steps.version.outputs.version }}
      # Release 最后创建，而且先建成草稿、核对附件后再公开：正式版一旦公开，releases/latest、
      # 自动更新和发布 watcher 都会立刻读到它，附件缺一件就是一次对外的不完整发版。
      # 这里失败时 tag 与 main 都已在远端（因此不会出现孤儿版本），按提示补建/修好这一版即可；
      # 不要重新触发发版，那会多发一版。
      - name: 创建 GitHub Release（草稿）
        run: |
          node scripts/release/changelog.mjs --body "$VERSION" \
            > release-notes.md
          for attempt in 1 2 3; do
            gh release create "v$VERSION" \
              --title "Yonder $VERSION" \
              --notes-file release-notes.md \
              --draft --verify-tag \
              dist-release/*.tgz dist-release/SHA256SUMS \
              dist-release/install.sh dist-release/install.ps1 && exit 0
            sleep 15
          done
          echo "::error::草稿 Release 创建失败。tag v$VERSION 与 main 已推送，不要重新发版；修好原因后手工执行 gh release create 补建"
          exit 1
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 附件数量 = 可打包 workspace 包数 + SHA256SUMS + install.sh + install.ps1，少一件就不公开。
      - name: 核对附件齐全
        run: |
          expected=$(node --input-type=module -e "import { packablePackages } from './scripts/release/pack-runtime.mjs'; console.log(packablePackages(process.cwd()).length + 3)")
          actual=$(gh release view "v$VERSION" --json assets --jq '.assets | length')
          echo "附件 $actual 个，期望 $expected 个"
          test "$actual" -eq "$expected" || {
            echo "::error::附件不全（$actual/$expected）。草稿保留在 v$VERSION，补齐后执行 gh release edit v$VERSION --draft=false --latest"
            exit 1
          }
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 公开 Release
        run: gh release edit "v$VERSION" --draft=false --latest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GITHUB_TOKEN 推送的提交不会再触发 push 事件，发版提交与 tag 因此从来没有跑过 CI。
      # 这里以 tag 为 ref 显式派发一次，让 CI 跑在发布出来的那个提交上；结论在 Actions 里看，
      # 红的话不回滚已发布的版本，修好后再发下一版。
      - name: 在发版提交上派发 CI
        run: gh workflow run ci.yml --ref "v$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 在精确发版提交上验收 Windows x64 与 ARM64 安装
        run: |
          if ! gh workflow run ci-windows.yml --ref "v$VERSION" \
            -f "version=$VERSION" -f "expected_commit=$(git rev-parse HEAD)"; then
            echo "::error::Release v$VERSION is already public, but Windows installer acceptance was not dispatched; installation is not verified. Do not create another release."
            exit 1
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 安卓 APK 与桌面安装包在各自的原生 runner 上构建后追加到同一个 Release，并上传 OSS。
      # GITHUB_TOKEN 创建的 Release 不会触发 release: published，所以和 CI 一样在这里显式派发；
      # 派发后仍未完成的构建只记警告，不回滚已发布的版本（正文与包仍未带上产物，由后续补跑补上）。
      - name: 派发安卓 APK 与桌面安装包构建
        continue-on-error: true
        run: |
          sha="$(git rev-parse HEAD)"
          failed=""
          for workflow in android-release.yml desktop-release.yml; do
            if ! gh workflow run "$workflow" --ref "v$VERSION" \
              -f "version=$VERSION" -f "expected_commit=$sha"; then
              failed="$failed $workflow"
            fi
          done
          {
            echo "release=published"
            echo "tag=v$VERSION"
            echo "sha=$sha"
            if [ -z "$failed" ]; then echo "packages=dispatched"; else echo "packages=pending:$failed"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            echo "::warning::Release v$VERSION is public but these builds were not dispatched:$failed. Rerun them manually with workflow_dispatch on tag v$VERSION; do not create a new release."
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 正式版公开后可选通知网页部署；没有跨仓凭据时由私有 Cloud 工作流从公开 Release 协调。
      - name: 派发网页部署
        id: dispatch
        continue-on-error: true
        run: |
          tag="v$VERSION"
          sha="$(git rev-parse HEAD)"
          if [ -z "${GH_TOKEN:-}" ]; then
            result=web-pending-reconcile
            reason="CLOUD_DISPATCH_TOKEN is not configured; Cloud schedule is the fallback"
          else
            if dispatch_error=$(gh api "repos/GoYonderTogether/yonder-cloud/dispatches" \
              -f event_type=deploy-web \
              -f "client_payload[tag]=$tag" \
              -f "client_payload[sha]=$sha" 2>&1); then
              result=dispatched
              reason="Cloud accepted the deployment notification; verify the Cloud run separately"
            else
              status=$?
              http_status=$(printf '%s\n' "$dispatch_error" | grep -Eo 'HTTP [0-9]{3}' | tail -1 || true)
              result=web-pending-reconcile
              reason="repository_dispatch failed (${http_status:-gh exit $status}); Cloud schedule is the fallback"
            fi
          fi
          {
            echo "release=published"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "result=$result"
            echo "reason=$reason"
          } > "$GITHUB_STEP_SUMMARY"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = web-pending-reconcile ]; then
            echo "::warning::Release $tag is public; web deployment remains pending reconciliation: $reason"
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
      - name: 网页部署未派发时说明
        if: ${{ steps.dispatch.outcome == 'failure' }}
        run: |
          tag="v$VERSION"
          sha="$(git rev-parse HEAD)"
          {
            echo "release=published"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "result=web-pending-reconcile"
            echo "reason=dispatch step failed unexpectedly; Cloud schedule is the fallback"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Release $tag is public; web deployment notification failed unexpectedly, and Cloud reconciliation remains pending."
        env:
          VERSION: ${{ steps.version.outputs.version }}
