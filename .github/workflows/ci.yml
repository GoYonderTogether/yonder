name: CI

on:
  push:
    branches:
      - main
      - yonder/memory-integration-20261022
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS typecheck, build, test, lint
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: brew install ripgrep
      - run: npm ci
      - run: node scripts/check-pi-durable-workspace.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/yonder-permissions.mjs self-check
      - run: npm test -- --maxWorkers=4
      - run: npm run lint

  linux:
    name: Linux typecheck, build, test, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get install -y ripgrep
      - run: npm ci
      - run: node scripts/check-pi-durable-workspace.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --maxWorkers=4
      - run: npm run lint

  windows:
    # Not yet verified on a runner (release-ci.md S1): informational until it is green repeatedly.
    name: Windows typecheck, build, test
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --maxWorkers=2
