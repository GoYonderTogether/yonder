# Only a successful CI on a same-repository main push can request an official release.
name: Auto release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Never download artifacts or execute code from a PR/fork run.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recheck CI identity, current main and duplicate releases
        run: node scripts/release/auto-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
