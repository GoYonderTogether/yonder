# 安卓 APK 构建与分发：签名 APK → GitHub Release 资产 `yonder-android.apk` + OSS（docs/spec/09 §6.3）。
#
# 触发方式：`release.yml` 在正式 Release 公开后以发版 tag 显式派发（`gh workflow run android-release.yml
# --ref v$VERSION -f version=… -f expected_commit=…`）。不要依赖 `release: published`：本仓的 Release 由
# release.yml 用 GITHUB_TOKEN 创建，GITHUB_TOKEN 产生的事件不会再触发任何工作流，那个触发器在本仓永远不会来；
# 它保留只为手工在网页上公开 Release 的场合。此时没有 version 输入，版本取 `github.event.release.tag_name`。
name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 本次发布版本 0.<minor>.<YYMMDDNN>（不带 v）
        required: true
        type: string
      expected_commit:
        description: 发版 tag 应指向的完整 40 位提交 SHA；不一致就拒绝
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  apk:
    name: Signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.event.release.tag_name }}
          fetch-depth: 1
      # 版本只在这里确定并写进 GITHUB_ENV：apps/desktop 不在 npm workspaces，bump-versions.mjs 不改它的
      # package.json / tauri.conf.json，所以不从仓库文件读版本，后面各步一律用 $VERSION。
      - name: 核对 tag → 提交并确定版本
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          tag="${INPUT_VERSION:-$RELEASE_TAG}"
          tag="v${tag#v}"
          version="${tag#v}"
          [[ "$version" =~ ^0\.[0-9]+\.[0-9]{8}$ ]] || {
            echo "::error::版本不是 0.<minor>.<YYMMDDNN>：$version"
            exit 1
          }
          head_sha="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_COMMIT" ]; then
            [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_commit 不是 40 位 SHA"; exit 1; }
            [ "$head_sha" = "$EXPECTED_COMMIT" ] || {
              echo "::error::$tag 指向 $head_sha，不是预期的 $EXPECTED_COMMIT"
              exit 1
            }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "版本 $version，tag $tag，提交 $head_sha"

      # AGP 需要 JDK 17+；runner 自带的 Android SDK/NDK 版本决定 C 编译器路径。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 工具链与 apps/desktop/rust-toolchain.toml 一致；目标一次装齐，构建中途不再去装。
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android
      - name: 定位 Android SDK 与 NDK
        run: |
          set -eu
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$sdk" ] && [ -d "$sdk/ndk" ] || {
            echo "::error::runner 上找不到 Android SDK 或 NDK（ANDROID_SDK_ROOT=$sdk）"
            exit 1
          }
          ndk="$(ls -d "$sdk"/ndk/* | sort -V | tail -1)"
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "NDK_HOME=$ndk"
            echo "NDK_BIN=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
            # ring（ureq 的 rustls 后端）由 cc-rs 编 C，它按名字在 PATH 里找
            # `aarch64-linux-androidNN-clang`，所以 NDK 的 bin 必须前置。
            echo "PATH=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          } >> "$GITHUB_ENV"
          echo "SDK=$sdk，NDK=$ndk"
      - name: 校验构建前提
        run: |
          set -eu
          test -x "$NDK_BIN/aarch64-linux-android24-clang" || {
            echo "::error::$NDK_BIN 里没有 aarch64-linux-android24-clang；检查 NDK 版本"
            exit 1
          }
          # cc-rs 按名字找编译器，先确认 NDK bin 真的在 PATH 里。
          command -v aarch64-linux-android24-clang
          aarch64-linux-android24-clang --version | head -1
          rustc --print target-list | grep -qx aarch64-linux-android
          node --version
          java -version

      - name: 还原签名材料
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "::error::缺少 secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "::error::缺少 secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          dir="$RUNNER_TEMP/yonder-signing"
          mkdir -p "$dir"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$dir/yonder-release.jks"
          # 密码与别名只经环境变量交给 prepare-android.mjs，不写日志；构建结束删除 keystore。
          {
            echo "YONDER_ANDROID_KEYSTORE=$dir/yonder-release.jks"
            echo "YONDER_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "YONDER_ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-yonder}"
          } >> "$GITHUB_ENV"

      - name: 安装 apps/desktop 依赖
        run: cd apps/desktop && npm install
      - name: 初始化 Android 工程
        run: cd apps/desktop && npx tauri android init --ci
      - name: 重放签名与镜像设置
        run: |
          cd apps/desktop
          node prepare-android.mjs --keystore "$YONDER_ANDROID_KEYSTORE" --alias "$YONDER_ANDROID_KEY_ALIAS"
      # tauri android init 生成的 Gradle 构建任务会回调 `npm run tauri android android-studio-script`。
      # 已发布的旧 tag 可能还没有这个脚本，这里补上（幂等）；包内脚本缺失时 APK 构建会以
      # "Missing script: tauri" 失败，而补这一行不改动产物内容。
      - name: 确保桌面包暴露 tauri 脚本
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "apps/desktop/package.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.scripts = { ...manifest.scripts, tauri: manifest.scripts.tauri ?? "tauri" };
            fs.writeFileSync(file, `${JSON.stringify(manifest, null, "\t")}\n`);
          '
      # versionName/versionCode 只从本次 Release 版本推导：versionCode = YYMMDDNN（235/26103020 同量纲），
      # 用 --config 覆盖，不回写仓库文件。tauri.android.conf.json 的静态值只是本地 debug 的占位。
      - name: 计算 versionCode
        id: code
        run: |
          version_code="$(node --input-type=module -e "import { androidVersionCode } from './scripts/release/android.mjs'; console.log(androidVersionCode(process.env.VERSION))")"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "versionCode=$version_code（$VERSION）"
      - name: 构建签名 APK
        env:
          VERSION_CODE: ${{ steps.code.outputs.version_code }}
        run: |
          cd apps/desktop
          npx tauri android build --apk --target aarch64 \
            --config "{\"version\":\"$VERSION\",\"bundle\":{\"android\":{\"versionCode\":${VERSION_CODE}}}}"

      - name: 校验并收集 APK
        run: |
          set -eu
          apk="$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | sort | head -1)"
          [ -n "$apk" ] || { echo "::error::没有找到构建出的 APK"; exit 1; }
          mkdir -p dist-android
          cp "$apk" dist-android/yonder-android.apk
          # 签名必须来自 release 密钥而不是 debug 兜底：把签名证书打印出来存档，并核对确实已签名。
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          [ -n "$apksigner" ] || { echo "::error::build-tools 里没有 apksigner，无法核对签名"; exit 1; }
          "$apksigner" verify --print-certs dist-android/yonder-android.apk
          sha256sum dist-android/yonder-android.apk
          ls -l dist-android/yonder-android.apk

      - name: 上传 GitHub Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist-android/yonder-android.apk --clobber

      - name: 发布到 OSS
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          [ -n "${ALIBABA_CLOUD_ACCESS_KEY_ID:-}" ] || { echo "::error::缺少 secret ALIBABA_CLOUD_ACCESS_KEY_ID"; exit 1; }
          [ -n "${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}" ] || { echo "::error::缺少 secret ALIBABA_CLOUD_ACCESS_KEY_SECRET"; exit 1; }
          notes="$RUNNER_TEMP/android-notes.md"
          gh release view "$TAG" --json body --jq .body > "$notes"
          node scripts/release/android.mjs --version "$VERSION" \
            --apk dist-android/yonder-android.apk --notes "$notes"

      - name: 清理签名材料
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP/yonder-signing"
          rm -f "$RUNNER_TEMP/android-notes.md"
          rm -f apps/desktop/src-tauri/gen/android/keystore.properties
