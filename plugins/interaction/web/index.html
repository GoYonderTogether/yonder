<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Yonder</title><style>/* STYLES */</style></head><body>
<!-- ICONS -->
<header class="preview-bar"><span>Yonder</span><nav aria-label="显示方式"><a href="#window">独立窗口</a><a href="#notice">页面提醒</a><a href="#inline">聊天内嵌</a></nav><button type="button" id="launcher" aria-label="打开交互" aria-expanded="true"><span class="static-mark"></span></button></header>
<main id="panel" class="panel" aria-label="交互窗口">
<header class="panel-header" title="拖动空白处移动窗口"><div id="character-button" class="character-button"><svg id="character" aria-hidden="true"></svg></div><span class="name">Yonder</span><div class="actions"><button type="button" id="board-button" class="icon-button" aria-label="任务看板" title="任务看板" hidden><svg aria-hidden="true"><use href="#i-board"/></svg></button><button type="button" id="pin-button" class="icon-button" aria-label="固定悬浮入口" title="固定悬浮入口" aria-pressed="false" hidden><svg aria-hidden="true"><use href="#i-pin"/></svg></button><button type="button" id="history-button" class="icon-button" aria-label="交互历史" title="交互历史"><svg aria-hidden="true"><use href="#i-history"/></svg></button><button type="button" id="close" class="icon-button" aria-label="收起" title="收起"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div></header>
<div class="panel-scroll">
<section id="agents-view" class="view" hidden><div id="agents" data-selectable></div></section>
<section id="board-view" class="view" hidden><button type="button" id="board-back" class="back context" hidden><svg aria-hidden="true"><use href="#i-back"/></svg>任务看板</button><h1>任务看板</h1><div id="board-content" data-selectable></div></section>
<section id="task-view" class="view"><p id="task-context" class="context"></p><h1 id="task-title">暂无待处理交互</h1><section id="choices" class="choices" aria-label="选择"></section><form id="note-form" hidden><label for="note" class="sr-only">补充想法</label><textarea id="note" rows="3" maxlength="2000" placeholder="写下你的想法…"></textarea><button type="submit" id="finish" class="primary">完成<svg aria-hidden="true"><use href="#i-check"/></svg></button></form></section>
<section id="done-view" class="view" hidden><p class="context">已完成</p><h1 id="done-title">已记录</h1><div id="done-summary" class="reading" data-selectable></div></section>
<section id="history-view" class="view" hidden><button type="button" class="back context" id="history-back"><svg aria-hidden="true"><use href="#i-back"/></svg>返回当前交互</button><h1>交互历史</h1><div id="history"></div></section>
<section id="replay-view" class="view" hidden><button type="button" class="back context" id="replay-back"><svg aria-hidden="true"><use href="#i-back"/></svg>交互历史</button><h1 id="replay-title">历史窗口</h1><div id="replay" data-selectable></div></section>
</div><p id="storage-error" class="storage-error" role="alert" hidden></p></main>
<button type="button" id="reopen" class="reopen" aria-label="待处理交互，点击展开" hidden><span class="static-mark"></span><span id="board-count" class="board-count" hidden></span><span class="pending-dot"></span></button><p id="announcement" class="sr-only" role="status" aria-live="polite"></p><script type="module">/* SCRIPT */</script></body></html>
